<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BozzDex Mobile v75.5</title>
    <style>
        :root {
            --bg: #030303; --card: #0f0f0f; --inner: #000000;
            --gold: #d4af37; --gold-dark: #b8860b; --text: #ffffff; --dim: #888;
            --accent: #a020f0; /* Vibe ungu OPNSwap */
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
        }

        /* Nav Header */
        header {
            position: fixed; top: 0; left: 0; right: 0; height: 70px;
            padding: env(safe-area-inset-top) 20px 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1a1a1a; z-index: 100;
        }
        .brand { font-weight: 900; font-size: 1.2rem; color: var(--gold); letter-spacing: 1px; }

        main {
            position: absolute; top: 70px; bottom: 0; left: 0; right: 0;
            padding: 15px; overflow-y: auto; display: flex; flex-direction: column;
        }

        /* Tab Utama (Top Level) */
        .main-tabs {
            display: flex; background: var(--inner); border-radius: 20px;
            padding: 5px; margin-bottom: 20px; border: 1px solid #1a1a1a;
        }
        .m-tab {
            flex: 1; padding: 12px; text-align: center; font-size: 13px; 
            font-weight: 700; color: var(--dim); border-radius: 16px; transition: 0.3s;
        }
        .m-tab.active { background: #1a1a1a; color: var(--gold); }

        /* Card Container */
        .card {
            background: var(--card); border-radius: 30px; 
            padding: 20px 15px; border: 1px solid #222;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        /* Liquidity Sub-Tabs */
        .sub-nav {
            display: flex; background: var(--inner); border-radius: 15px;
            margin-bottom: 20px; padding: 4px; border: 1px solid #111;
        }
        .s-tab {
            flex: 1; padding: 10px; font-size: 11px; font-weight: 700; 
            color: var(--dim); border-radius: 12px; text-align: center;
        }
        .s-tab.active { background: #222; color: #fff; }

        /* Input Native Box */
        .input-group {
            background: var(--inner); border-radius: 22px; padding: 18px;
            border: 1px solid #111; margin-bottom: 8px;
        }
        .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-bottom: 10px; }
        .row { display: flex; align-items: center; justify-content: space-between; }
        input { background: transparent; border: none; color: #fff; font-size: 26px; font-weight: bold; width: 60%; }
        
        .token-pill {
            background: #1a1a1a; padding: 8px 12px; border-radius: 14px;
            display: flex; align-items: center; gap: 8px; border: 1px solid #333;
        }
        select { background: transparent; border: none; color: #fff; font-weight: bold; font-size: 13px; }

        .divider { display: flex; justify-content: center; margin: -22px 0; position: relative; z-index: 10; }
        .circle-btn {
            background: #111; border: 4px solid var(--bg); width: 42px; height: 42px;
            border-radius: 12px; color: var(--gold); display: flex; align-items: center; justify-content: center;
            font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Remove Liquidity Slider */
        .slider-box { padding: 20px 10px; }
        input[type=range] { width: 100%; accent-color: var(--gold); margin: 15px 0; }
        .percent-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .p-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 10px; font-size: 11px; }

        /* Action Button */
        .btn-prime {
            width: 100%; padding: 18px; border-radius: 22px; border: none;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000; font-weight: 900; font-size: 16px; margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">BOZZ<span style="color:#fff">DEX</span></div>
        <div id="wallet" style="background:#1a1a1a; padding:8px 12px; border-radius:12px; font-size:11px; font-weight:bold; border:1px solid #333;">0x6666...1af4</div>
    </header>

    <main>
        <div class="main-tabs">
            <div class="m-tab active" id="m-swap" onclick="switchMain('swap')">Swap</div>
            <div class="m-tab" id="m-liq" onclick="switchMain('liq')">Liquidity</div>
        </div>

        <div class="card">
            <div id="liq-nav" class="sub-nav" style="display: none;">
                <div class="s-tab active" id="s-add" onclick="switchSub('add')">Add Liquidity</div>
                <div class="s-tab" id="s-rem" onclick="switchSub('rem')">Remove Liquidity</div>
            </div>

            <div id="dynamic-content">
                <div class="input-group">
                    <div class="meta"><span>From / Input</span><span>Balance: <b id="bal-in">0.00</b></span></div>
                    <div class="row">
                        <input type="number" id="amt-in" placeholder="0.0">
                        <div class="token-pill">
                            <select id="sel-in"><option>WOPN</option><option>OPNT</option></select>
                        </div>
                    </div>
                </div>

                <div class="divider"><div class="circle-btn" id="mid-icon">⇅</div></div>

                <div class="input-group" style="margin-top: 10px;" id="box-out">
                    <div class="meta"><span>To / Input</span><span>Balance: <b id="bal-out">0.00</b></span></div>
                    <div class="row">
                        <input type="number" id="amt-out" placeholder="0.0">
                        <div class="token-pill">
                            <select id="sel-out"><option>OPNT</option><option>WOPN</option></select>
                        </div>
                    </div>
                </div>

                <div id="remove-ui" class="slider-box" style="display: none;">
                    <div class="meta"><span>Amount to Remove: <b id="range-val">25%</b></span></div>
                    <input type="range" min="0" max="100" value="25" oninput="document.getElementById('range-val').innerText = this.value + '%'">
                    <div class="percent-grid">
                        <button class="p-btn">25%</button><button class="p-btn">50%</button>
                        <button class="p-btn">75%</button><button class="p-btn">100%</button>
                    </div>
                </div>
            </div>

            <button class="btn-prime" id="exec-btn" onclick="EngineHelper.execute()">Enter Amount</button>
        </div>
    </main>

    <script>
        function switchMain(mode) {
            const isLiq = mode === 'liq';
            document.getElementById('m-swap').className = isLiq ? 'm-tab' : 'm-tab active';
            document.getElementById('m-liq').className = isLiq ? 'm-tab active' : 'm-tab';
            document.getElementById('liq-nav').style.display = isLiq ? 'flex' : 'none';
            if(!isLiq) switchSub('swap'); // Reset ke swap if tab swap diklik
        }

        function switchSub(sub) {
            const isRem = sub === 'rem';
            document.getElementById('s-add').className = sub === 'add' ? 's-tab active' : 's-tab';
            document.getElementById('s-rem').className = isRem ? 's-tab active' : 's-tab';
            
            // Atur UI
            document.getElementById('box-out').style.display = isRem ? 'none' : 'block';
            document.getElementById('remove-ui').style.display = isRem ? 'block' : 'none';
            document.getElementById('mid-icon').innerText = isRem ? '↓' : (sub === 'add' ? '+' : '⇅');
            document.getElementById('exec-btn').innerText = isRem ? 'Remove Liquidity' : (sub === 'add' ? 'Add Liquidity' : 'Swap Asset');
        }
    </script>
</body>
</html>
