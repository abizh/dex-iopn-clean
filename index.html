<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN SENTINEL v90.8</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #0f0f0f; --accent: #00ff88; --warn: #ffcc00; --err: #ff4444; --text: #ececec; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .cockpit { width: 100%; max-width: 460px; background: var(--card); border: 1px solid #222; border-radius: 14px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        
        /* Fleet Radar */
        #fleet-overview { background: #080808; border: 1px solid #1a1a1a; padding: 16px; border-radius: 10px; margin-bottom: 24px; font-family: 'Courier New', monospace; }
        .fleet-status-bar { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .fleet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .fleet-card { border-left: 2px solid #333; padding-left: 10px; }
        .fleet-card.active { border-left-color: var(--accent); }
        .fleet-card.focus { border-left-color: var(--warn); background: rgba(255,204,0,0.03); }
        .fleet-card span { display: block; font-size: 0.6rem; color: #666; text-transform: uppercase; }
        .fleet-card b { font-size: 1rem; color: #fff; }
        
        /* Execution UI */
        .field { margin-bottom: 18px; }
        label { display: block; font-size: 0.7rem; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        select, input { width: 100%; background: #151515; border: 1px solid #333; color: #fff; padding: 14px; border-radius: 8px; box-sizing: border-box; font-size: 1rem; outline: none; }
        select:focus, input:focus { border-color: var(--accent); }
        .btn-exec { width: 100%; padding: 16px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 10px; transition: 0.3s; text-transform: uppercase; }
        .btn-exec:disabled { background: #222; color: #555; cursor: not-allowed; }
        
        /* Comm Channels */
        .status-pill { margin-top: 15px; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; text-align: center; border: 1px solid transparent; }
        .status-ok { background: rgba(0,255,136,0.08); color: var(--accent); border-color: rgba(0,255,136,0.2); }
        .status-bad { background: rgba(255,68,68,0.08); color: var(--err); border-color: rgba(255,68,68,0.2); font-weight: bold; }
        
        /* Forensic Logbook */
        #log-history { margin-top: 24px; max-height: 220px; overflow-y: auto; border-top: 1px solid #222; padding-top: 15px; font-family: monospace; font-size: 0.75rem; }
        .log-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #111; align-items: center; }
        .log-item.failed { color: #777; }
        .tag-fail { color: var(--err); font-weight: bold; margin-right: 6px; font-size: 0.65rem; border: 1px solid var(--err); padding: 1px 4px; border-radius: 3px; }
        .tag-success { color: var(--accent); font-size: 0.65rem; border: 1px solid var(--accent); padding: 1px 4px; border-radius: 3px; margin-right: 6px; }
        .log-hash { text-decoration: none; color: #444; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="cockpit">
    <div id="fleet-overview"></div>

    <div class="field">
        <label>Input Asset</label>
        <select id="sel-in" onchange="SovereignEngine.render()">
            <option value="OPN">OPN (Native)</option>
            <option value="tUSDT">tUSDT</option>
            <option value="OPNT">OPNT</option>
        </select>
        <input type="number" id="amt-in" placeholder="0.00" step="0.01">
        <div style="font-size: 0.7rem; color: #555; margin-top: 6px;">AVAILABLE: <span id="bal-in">0.0000</span></div>
    </div>

    <div class="field">
        <label>Output Asset</label>
        <select id="sel-out" onchange="SovereignEngine.render()">
            <option value="PRET">PRET</option>
            <option value="WOPN">WOPN</option>
            <option value="OPN">OPN (Native)</option>
        </select>
        <div style="font-size: 0.7rem; color: #555; margin-top: 6px;">BALANCE: <span id="bal-out">0.0000</span></div>
    </div>

    <button id="exec-btn" class="btn-exec" onclick="SovereignEngine.execute()">Initiate Mission</button>
    <div id="kernelState" class="status-pill status-ok">SYSTEM READY</div>

    <div id="log-history"></div>
</div>

<script>
/**
 * SOVEREIGN ENGINE v90.8 - THE FINAL SENTINEL
 * Protokol: Deep Sleep, Adaptive Backoff, Epoch Guard, & Forensic Mapping
 */

const SovereignEngine = (() => {
    const _CONFIG = Object.freeze({
        ROUTER: "0x98cbC837fD05cA7b0ed075990667E93ae0EE1961",
        WOPN: "0xBc022C9dEb5AF250A526321d16Ef52E39b4DBD84",
        ROUTER_ABI: [
            "function getAmountsOut(uint amtIn, address[] path) view returns (uint[] amts)",
            "function swapExactTokensForTokensSupportingFeeOnTransferTokens(uint amtIn, uint amtOutMin, address[] path, address to, uint deadline)",
            "function swapExactETHForTokensSupportingFeeOnTransferTokens(uint amtOutMin, address[] path, address to, uint deadline) payable",
            "function swapExactTokensForETHSupportingFeeOnTransferTokens(uint amtIn, uint amtOutMin, address[] path, address to, uint deadline)"
        ],
        ASSETS: {
            OPN:   { addr: "NATIVE", dec: 18, slip: 2 },
            WOPN:  { addr: "0xBc022C9dEb5AF250A526321d16Ef52E39b4DBD84", dec: 18, slip: 1 },
            OPNT:  { addr: "0x2aEc1Db9197Ff284011A6A1d0752AD03F5782B0d", dec: 18, slip: 3 },
            tUSDT: { addr: "0x3e01b4d892E0D0A219eF8BBe7e260a6bc8d9B31b", dec: 18, slip: 2 },
            PRET:  { addr: "0xEcbf04b23f5b15492794dE22Da5A9819b60B88FD", dec: 18, slip: 12, hasFee: true }
        }
    });

    let _hydrateEpoch = 0;
    let _notifyToken = 0;
    let _consecutiveFails = 0;
    let _pollTimeout = null;
    let _savedLogs = [];
    
    try { _savedLogs = JSON.parse(localStorage.getItem('bozzdex_v90_logs')) || []; } catch(e) { _savedLogs = []; }

    const _STATE = { 
        address: null, 
        balances: {}, 
        status: "IDLE", 
        error: "", 
        message: "", 
        logs: _savedLogs 
    };

    let _provider = window.ethereum ? new ethers.BrowserProvider(window.ethereum) : null;

    const _core = {
        async fetchRawBalance(sym, provider, address) {
            const asset = _CONFIG.ASSETS[sym];
            if (asset.addr === "NATIVE") return await provider.getBalance(address);
            return await (new ethers.Contract(asset.addr, ["function balanceOf(address) view returns (uint256)"], provider)).balanceOf(address);
        },

        async getValidatedPath(sIn, sOut, amtWei) {
            const aIn = _CONFIG.ASSETS[sIn].addr === "NATIVE" ? _CONFIG.WOPN : _CONFIG.ASSETS[sIn].addr;
            const aOut = _CONFIG.ASSETS[sOut].addr === "NATIVE" ? _CONFIG.WOPN : _CONFIG.ASSETS[sOut].addr;
            const direct = [aIn, aOut];
            const bridge = [aIn, _CONFIG.WOPN, aOut];
            try {
                const r = new ethers.Contract(_CONFIG.ROUTER, _CONFIG.ROUTER_ABI, _provider);
                const q = await r.getAmountsOut(amtWei, direct);
                if (q[1] > 0n) return direct;
            } catch (e) {}
            return bridge;
        },

        saveLog(entry) {
            try {
                const atomicEntry = { ts: Date.now(), time: new Date().toLocaleTimeString(), ...entry };
                _STATE.logs.unshift(atomicEntry);
                if (_STATE.logs.length > 20) _STATE.logs.pop();
                localStorage.setItem('bozzdex_v90_logs', JSON.stringify(_STATE.logs));
            } catch (e) { console.warn("Black Box Full"); }
        },

        notify(msg, type = "INFO") {
            const token = ++_notifyToken;
            if (type === "ERR") {
                _STATE.error = msg;
                _STATE.message = "";
            } else {
                _STATE.message = msg;
                _STATE.error = "";
                setTimeout(() => {
                    if (_notifyToken === token) {
                        _STATE.message = "";
                        SovereignEngine.render();
                    }
                }, 7000);
            }
            SovereignEngine.render();
        },

        getFleetIntelligence() {
            if (_STATE.logs.length === 0) return { health: "STANDBY", lastSuccess: "NONE", lastHeartbeat: "NONE", count: 0 };
            const sorted = [..._STATE.logs].sort((a, b) => b.ts - a.ts);
            const window = sorted.slice(0, 10);
            const fails = window.filter(l => l.status === "FAILED").length;
            let h = "OPERATIONAL";
            if (fails >= 4) h = "CRITICAL"; else if (fails >= 2) h = "WARNING";
            return { health: h, lastSuccess: sorted.find(l => l.status === "SUCCESS")?.time || "NEVER", lastHeartbeat: sorted[0].time, count: _STATE.logs.length };
        }
    };

    return {
        async hydrate() {
            if (_pollTimeout) clearTimeout(_pollTimeout);
            
            // DEEP SLEEP PROTOCOL
            if (document.hidden || !_STATE.address || !_provider) {
                console.log("SENTINEL_HIBERNATION: Active");
                return;
            }

            const epoch = ++_hydrateEpoch;
            const res = {};
            try {
                for (const s of Object.keys(_CONFIG.ASSETS)) {
                    if (epoch !== _hydrateEpoch) return;
                    const bal = await _core.fetchRawBalance(s, _provider, _STATE.address);
                    res[s] = ethers.formatUnits(bal, _CONFIG.ASSETS[s].dec);
                }
                if (epoch !== _hydrateEpoch) return;
                _STATE.balances = res;
                _consecutiveFails = 0;
                this.render();
            } catch (e) {
                _consecutiveFails++;
                if (_consecutiveFails >= 3) _core.notify("NETWORK_UNSTABLE", "ERR");
            } finally {
                if (!document.hidden) this.scheduleHydrate();
            }
        },

        scheduleHydrate() {
            if (document.hidden) return;
            // ADAPTIVE BACKOFF: 5s -> 10s -> 20s -> 60s
            let delay = 5000;
            if (_consecutiveFails === 1) delay = 10000;
            else if (_consecutiveFails === 2) delay = 20000;
            else if (_consecutiveFails >= 3) delay = 60000;
            _pollTimeout = setTimeout(() => this.hydrate(), delay);
        },

        render() {
            const sIn = document.getElementById('sel-in').value;
            const sOut = document.getElementById('sel-out').value;
            document.getElementById('bal-in').innerText = parseFloat(_STATE.balances[sIn] || 0).toFixed(4);
            document.getElementById('bal-out').innerText = parseFloat(_STATE.balances[sOut] || 0).toFixed(4);
            
            const k = document.getElementById('kernelState');
            if (_STATE.error) {
                k.innerText = `[!] ${_STATE.error}`;
                k.className = "status-pill status-bad";
            } else if (_STATE.message) {
                k.innerText = `[*] ${_STATE.message}`;
                k.className = "status-pill status-ok";
            } else {
                k.innerText = `SYSTEM ${_STATE.status}`;
                k.className = "status-pill status-ok";
            }

            document.getElementById('exec-btn').disabled = (_STATE.status !== "IDLE" || sIn === sOut);

            const intel = _core.getFleetIntelligence();
            const fleet = document.getElementById('fleet-overview');
            if (fleet) {
                const assets = ['OPN', 'PRET', 'tUSDT'];
                fleet.innerHTML = `
                    <div class="fleet-status-bar">
                        <span style="color:${intel.health==='CRITICAL'?'#ff4444':intel.health==='WARNING'?'#ffcc00':'#00ff88'}">● ${intel.health}</span>
                        <span style="color:#555">${intel.lastHeartbeat} | MIS: ${intel.count}</span>
                    </div>
                    <div class="fleet-grid">
                        ${assets.map(s => `
                            <div class="fleet-card ${s==='PRET'?'focus':'active'}">
                                <span>${s} POS</span>
                                <b>${parseFloat(_STATE.balances[s]||0).toFixed(3)}</b>
                            </div>`).join('')}
                    </div>
                `;
            }

            document.getElementById('log-history').innerHTML = _STATE.logs.map(log => 
                log.status === "SUCCESS" ? 
                `<div class="log-item"><span class="tag-success">SUCCESS</span><span>${log.pair} | +${log.net}</span><a class="log-hash" href="https://testnet.iopn.tech/tx/${log.hash}" target="_blank">🔗</a></div>` :
                `<div class="log-item failed"><span class="tag-fail">${log.phase}</span><span>${log.reason}</span></div>`
            ).join('');
        },

        async execute() {
            if (_STATE.status !== "IDLE") return;
            _STATE.error = ""; _STATE.message = "";
            const sIn = document.getElementById('sel-in').value;
            const sOut = document.getElementById('sel-out').value;
            const val = document.getElementById('amt-in').value;
            let currentPhase = "PRE-FLIGHT";

            try {
                const signer = await _provider.getSigner();
                const router = new ethers.Contract(_CONFIG.ROUTER, _CONFIG.ROUTER_ABI, signer);
                const amtWei = ethers.parseUnits(val, _CONFIG.ASSETS[sIn].dec);

                currentPhase = "ROUTING"; _STATE.status = currentPhase; this.render();
                const path = await _core.getValidatedPath(sIn, sOut, amtWei);

                currentPhase = "QUOTING"; _STATE.status = currentPhase; this.render();
                const quotes = await router.getAmountsOut(amtWei, path);
                let qOut = quotes[quotes.length - 1];
                if (_CONFIG.ASSETS[sIn].hasFee || _CONFIG.ASSETS[sOut].hasFee) qOut = (qOut * 92n) / 100n;
                const minOut = (qOut * BigInt(100 - (_CONFIG.ASSETS[sOut].slip || 5))) / 100n;

                const balBefore = await _core.fetchRawBalance(sOut, _provider, _STATE.address);

                if (_CONFIG.ASSETS[sIn].addr !== "NATIVE") {
                    currentPhase = "APPROVING"; _STATE.status = currentPhase; this.render();
                    await (await (new ethers.Contract(_CONFIG.ASSETS[sIn].addr, ["function approve(address,uint256) returns (bool)"], signer)).approve(_CONFIG.ROUTER, amtWei)).wait();
                }

                currentPhase = "SWAPPING"; _STATE.status = currentPhase; this.render();
                const deadline = Math.floor(Date.now() / 1000) + 1200;
                let tx;
                if (sIn === "OPN") tx = await router.swapExactETHForTokensSupportingFeeOnTransferTokens(minOut, path, _STATE.address, deadline, { value: amtWei });
                else if (sOut === "OPN") tx = await router.swapExactTokensForETHSupportingFeeOnTransferTokens(amtWei, minOut, path, _STATE.address, deadline);
                else tx = await router.swapExactTokensForTokensSupportingFeeOnTransferTokens(amtWei, minOut, path, _STATE.address, deadline);

                _STATE.status = "MINING"; this.render();
                const receipt = await tx.wait();

                const balAfter = await _core.fetchRawBalance(sOut, _provider, _STATE.address);
                let diff = balAfter - balBefore;
                if (sOut === "OPN") diff += (receipt.gasUsed * (receipt.effectiveGasPrice || receipt.gasPrice));

                _core.saveLog({ pair: `${sIn}→${sOut}`, net: ethers.formatUnits(diff, _CONFIG.ASSETS[sOut].dec).slice(0, 8), hash: receipt.hash, status: "SUCCESS" });
                _STATE.status = "SUCCESS"; _core.notify("MISSION ACCOMPLISHED", "OK");

            } catch (e) {
                const isReject = e.code === "ACTION_REJECTED" || e.code === 4001;
                const isNetwork = e.code === "NETWORK_ERROR" || e.message?.includes("network") || e.cause?.code === "ECONNREFUSED";
                const actor = isReject ? "USER_ABORT" : (isNetwork ? "NETWORK_FAIL" : "CONTRACT_REVERT");
                const reason = e.shortMessage || e.reason || e.message || "UNKNOWN";

                _core.saveLog({ pair: `${sIn}→${sOut}`, phase: currentPhase, reason: `${actor}: ${reason.slice(0, 20)}`, status: "FAILED" });
                _core.notify(`${actor} @ ${currentPhase}`, "ERR");
                _STATE.status = "ERROR";
            } finally {
                setTimeout(() => { _STATE.status = "IDLE"; _STATE.error = ""; this.hydrate(); }, 5000);
            }
        },

        boot() {
            if (!_provider) return;
            window.ethereum.on('accountsChanged', () => window.location.reload());
            window.ethereum.on('chainChanged', () => window.location.reload());
            
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    console.log("SENTINEL_WAKE: Immediate Recovery");
                    this.hydrate();
                }
            });

            window.ethereum.request({ method: 'eth_requestAccounts' }).then(accs => {
                _STATE.address = accs[0];
                this.hydrate();
            });
        }
    };
})();

SovereignEngine.boot();
</script>
</body>
