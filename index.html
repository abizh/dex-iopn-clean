<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sovereign Sentinel v91.4</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>

<style>
:root{
  --bg:#050505;
  --card:#101010;
  --line:#1f1f1f;
  --ok:#00ff88;
  --err:#ff4d4d;
  --txt:#ececec;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font-family:Segoe UI,sans-serif;
  display:flex;
  justify-content:center;
  padding:20px;
}

.cockpit{
  width:100%;
  max-width:520px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
}

.title{
  text-align:center;
  color:var(--ok);
  font-weight:900;
  margin-bottom:20px;
  letter-spacing:1px;
}

.fleet-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:18px;
}

.fleet-card{
  background:#151515;
  border:1px solid #252525;
  border-radius:10px;
  padding:10px;
  text-align:center;
}

.fleet-card span{
  display:block;
  font-size:.7rem;
  color:#888;
}

.fleet-card b{
  font-size:1rem;
}

.field{
  margin-bottom:14px;
}

label{
  display:block;
  margin-bottom:6px;
  font-size:.72rem;
  color:#888;
  text-transform:uppercase;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

select,input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#181818;
  color:#fff;
}

button{
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.btn-mini{
  margin-top:8px;
  padding:7px 12px;
  background:#222;
  color:#ccc;
}

.btn-exec{
  width:100%;
  padding:15px;
  background:var(--ok);
  color:#000;
  font-weight:800;
}

.btn-exec:disabled{
  background:#222;
  color:#666;
  cursor:not-allowed;
}

.status-pill{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-family:monospace;
}

.status-ok{
  background:rgba(0,255,136,.1);
  color:var(--ok);
}

.status-bad{
  background:rgba(255,77,77,.1);
  color:var(--err);
}

#log-history{
  margin-top:18px;
  border-top:1px solid #222;
  padding-top:12px;
  max-height:180px;
  overflow:auto;
  font-size:.75rem;
  font-family:monospace;
}

.log-item{
  padding:6px 0;
  border-bottom:1px solid #151515;
}

.log-success{
  color:var(--ok);
}

.log-failed{
  color:var(--err);
}

a{
  color:#777;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="cockpit">

<div class="title">
SOVEREIGN SENTINEL v91.4
</div>

<div id="fleet-overview"></div>

<div class="field">
<label>Input Asset</label>

<div class="row">
<select id="sel-in" onchange="UI.preview()">
<option value="OPN">OPN</option>
<option value="WOPN">WOPN</option>
<option value="OPNT">OPNT</option>
<option value="tUSDT">tUSDT</option>
<option value="tBNB">tBNB</option>
<option value="PRET">PRET</option>
</select>

<select id="sel-out" onchange="UI.preview()">
<option value="PRET">PRET</option>
<option value="WOPN">WOPN</option>
<option value="OPN">OPN</option>
<option value="OPNT">OPNT</option>
<option value="tUSDT">tUSDT</option>
<option value="tBNB">tBNB</option>
</select>
</div>

<div style="margin-top:5px;font-size:.72rem;color:#777;">
AVAILABLE:
<span id="bal-in">0.0000</span>
</div>

</div>

<div class="field">
<label>Amount In</label>

<input
id="amt-in"
type="number"
step="any"
placeholder="0.0"
oninput="UI.preview()"
/>

<button class="btn-mini" onclick="UI.max()">
MAX SALDO
</button>
</div>

<div class="field">
<label>Estimated Out (Min)</label>

<input
id="amt-out"
readonly
placeholder="0.0"
/>

<div style="margin-top:5px;font-size:.72rem;color:#777;">
BALANCE:
<span id="bal-out">0.0000</span>
</div>

</div>

<button id="exec-btn" class="btn-exec" onclick="UI.execute()" disabled>
EXECUTE MISSION
</button>

<div id="kernelState" class="status-pill status-ok">
SYSTEM IDLE
</div>

<div id="log-history"></div>

</div>

<script src="app.js"></script>
</body>
</html>
EOF
